name: Build Mini App
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload isolated frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-affiliates-partners-dist
          path: dist/
