# Keep the existing theaffiliates.ru SSL server; add only these locations.
# This file is the live include on the current VPS: preserve the working alias.
location = /partners { return 308 /partners/; }
location /partners/api/ {
    proxy_pass http://127.0.0.1:8788/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /partners/ {
    alias /var/www/theaffiliates-partners/;
    try_files $uri $uri/ /partners/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
