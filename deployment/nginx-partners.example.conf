# Only add these locations to an EXISTING theaffiliates.ru HTTPS server block.
# Never replace existing server, location /, TLS, or proxy settings.
location = /partners { return 308 /partners/; }
location /partners/api/ {
    proxy_pass http://127.0.0.1:8788/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /partners/ {
    alias /var/www/theaffiliates-partners/;
    try_files $uri $uri/ /partners/index.html;
}
